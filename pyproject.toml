[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "probabilistic-retrieval-fields"
version = "0.1.0"
description = "Controlled experiments in stochastic retrieval over frozen embeddings"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.2"]
[project.optional-dependencies]
benchmark = ["sentence-transformers>=3", "huggingface-hub>=0.24", "pyarrow>=16"]
dev = ["pytest>=8", "matplotlib>=3.8"]
[project.scripts]
prf = "prf.cli:main"
[tool.setuptools.packages.find]
include = ["prf*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
